name: Daily portfolio report
on:
  workflow_dispatch:
  schedule:
    # UTC schedules: the script selects the one matching 20:xx Europe/Rome.
    - cron: '17 18,19 * * 5'
permissions:
  contents: read
concurrency:
  group: daily-portfolio-report
  cancel-in-progress: false
jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read analytics and email digest
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/daily_report.py

