<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Observe, decide, execute loop with task reward">
<style>
.bg{fill:#f4f4f6}.box{fill:#fff;stroke:#e8e8ea;stroke-width:2}.t{font:700 30px -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#0a0a0b}.s{font:400 17px -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#747479}.k{font:650 13px -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;letter-spacing:.14em;fill:#2457ff}.a{stroke:#2457ff;stroke-width:3;fill:none}.ah{fill:#2457ff}.d{stroke:#747479;stroke-width:2;stroke-dasharray:6 6;fill:none}.p{fill:#e438d0}.g{fill:#20c979}.y{fill:#ffcd1f}
@media (prefers-color-scheme:dark){.bg{fill:#18181b}.box{fill:#0a0a0b;stroke:#222225}.t{fill:#f4f4f6}.s{fill:#9e9ea3}.k{fill:#5580ff}.a{stroke:#5580ff}.ah{fill:#5580ff}}
</style>
<rect class="bg" width="960" height="540" rx="28"/>
<g><rect class="box" x="48" y="150" width="250" height="170" rx="20"/><circle class="g" cx="80" cy="186" r="8"/><text class="k" x="98" y="191">01 · OBSERVE</text><text class="t" x="72" y="240">Sensors</text><text class="s" x="72" y="272">stereo · RGB-D · LiDAR</text><text class="s" x="72" y="298">segmentation detector</text></g>
<g><rect class="box" x="355" y="150" width="250" height="170" rx="20"/><circle class="p" cx="387" cy="186" r="8"/><text class="k" x="405" y="191">02 · DECIDE</text><text class="t" x="379" y="240">Policy</text><text class="s" x="379" y="272">PPO teacher → student</text><text class="s" x="379" y="298">one object per step</text></g>
<g><rect class="box" x="662" y="150" width="250" height="170" rx="20"/><circle class="y" cx="694" cy="186" r="8"/><text class="k" x="712" y="191">03 · EXECUTE</text><text class="t" x="686" y="240">Action</text><text class="s" x="686" y="272">reachability check</text><text class="s" x="686" y="298">verified outcome</text></g>
<path class="a" d="M298 235 H345"/><path class="ah" d="M345 226 L357 235 L345 244Z"/>
<path class="a" d="M605 235 H652"/><path class="ah" d="M652 226 L664 235 L652 244Z"/>
<path class="a" d="M787 320 V420 H173 V332"/><path class="ah" d="M164 332 L173 320 L182 332Z"/>
<text class="s" x="480" y="447" text-anchor="middle">outcome observed → next decision</text>
<rect class="box" x="355" y="40" width="250" height="70" rx="18"/><text class="k" x="480" y="70" text-anchor="middle">TASK</text><text class="s" x="480" y="95" text-anchor="middle">reward terms · critical events</text>
<path class="d" d="M480 110 V150"/>
<text class="s" x="480" y="500" text-anchor="middle">MuJoCo simulation · seeded, reproducible scenes</text>
</svg>
